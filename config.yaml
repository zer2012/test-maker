# Configuration centrale du pipeline TestMaker.
languages: [python, javascript, go, rust, java]

paths:
  sources: data/sources.jsonl              # code source à tester (étape 1)
  teacher_gen: data/teacher_gen.jsonl      # sorties brutes du teacher (étape 2)
  teacher_val: data/teacher_val.jsonl      # sorties exécutées dans la sandbox (étape 3)
  sft_dir: data/sft                        # train.jsonl / val.jsonl (étape 4)
  sandbox_tmp: .sandbox_tmp                # doit être partagé avec Docker Desktop (OK sous /Users)

# Modèle professeur : n'importe quel endpoint compatible OpenAI. `provider` choisit le profil ;
# surcharge possible en ligne de commande avec `--provider`.
# - ollama : local, gratuit, lent sur CPU (~1-2 min par test) -> pour valider la chaîne.
# - openrouter : Qwen3-Coder-30B-A3B, rapide et meilleur -> pour le volume.
# L'identifiant du modèle dépend du fournisseur ("Qwen/Qwen2.5-Coder-32B-Instruct" sur vLLM).
teacher:
  provider: ollama
  providers:
    ollama:
      model: qwen2.5-coder:7b
      base_url: http://localhost:11434/v1
      api_key_env: OLLAMA_API_KEY      # inutilisé par Ollama, n'importe quelle valeur
      concurrency: 1                   # un seul modèle sur le CPU : paralléliser ne sert à rien
      timeout_s: 1800                  # une réponse de 2048 tokens peut dépasser 5 min sur CPU
    openrouter:
      # Qwen2.5-Coder-32B n'est servi que par Cloudflare sur OpenRouter, qui renvoie du texte corrompu
      # (tokens `[]` et retours à la ligne perdus). Qwen3-Coder-30B-A3B : meilleur, ~10x moins cher, Apache 2.0.
      model: qwen/qwen3-coder-30b-a3b-instruct
      base_url: https://openrouter.ai/api/v1
      api_key_env: TEACHER_API_KEY
      concurrency: 16
      # Préférences de routage OpenRouter, envoyées telles quelles. Si un fournisseur renvoie du
      # texte corrompu, les scripts affichent son nom à la fin : l'exclure avec, par exemple,
      #   extra_body: {provider: {ignore: ["NomDuFournisseur"]}}
      # ou imposer un ordre : {provider: {order: ["A", "B"], allow_fallbacks: false}}
      extra_body: {}
  n_candidates: 2          # rejection sampling : on garde le meilleur candidat validé
  temperature: 0.7        # candidats de tests : assez de variété pour que les 2 candidats diffèrent
  sources_temperature: 0.9 # invention des modules (étape 1) : plus de variété, un module raté est filtré
  max_tokens: 3072         # réponses tronquées = code inutilisable ; les modules Qwen3 font jusqu'à +-180 lignes

student:
  base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
  output_dir: checkpoints/testmaker-1.5b

collect:
  hf_dataset: bigcode/the-stack-smol       # dataset "gated" : accepter les conditions + `hf auth login`
  max_per_language: 4000
  min_lines: 15
  max_lines: 250

sandbox:
  timeout_s: 20            # par variante (original ou mutant) ; un test Python normal prend < 2 s, au-delà c'est une boucle infinie
  n_mutants: 3
  memory: 1g
  cpus: 1
  workers: 6               # conteneurs en parallèle (1 CPU chacun) ; ton i9 en a 16 logiques, Docker en voit 16

filter:
  min_mutation_score: 0.34 # au moins 1 mutant sur 3 doit être détecté par les tests
  max_pruned_ratio: 0.3    # élagage : on retire au plus 30% des fonctions de test qui échouent

# Entraînement LoRA (train/train_lora.py, sur GPU loué). Batch effectif = batch_size x grad_accum = 16.
sft:
  epochs: 2
  lr: 2.0e-4
  warmup: 0.05             # part des pas en montée progressive du learning rate
  batch_size: 2            # 2 x 4096 tokens : les logits (vocabulaire de 152k) tiennent sur 24 Go
  grad_accum: 8
  max_length: 4096         # les exemples plus longs sont écartés (pas tronqués : un test coupé apprend mal)
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  qlora: false             # true = modèle chargé en 4 bits (GPU < 16 Go) ; plus lent, à peine moins bon

# Distillation on-policy optionnelle (étape 6). Le teacher doit partager le tokenizer
# du student (famille Qwen2.5-Coder) car la perte compare les distributions de logits.
gkd:
  teacher_model: Qwen/Qwen2.5-Coder-14B-Instruct
  lmbda: 0.5               # part des séquences générées par le student lui-même
  beta: 0.5                # 0 = KL avant, 1 = KL inverse, entre les deux = JSD généralisée
  temperature: 0.9
  max_new_tokens: 1024
  epochs: 1
  lr: 5.0e-6
  batch_size: 2
  grad_accum: 8
