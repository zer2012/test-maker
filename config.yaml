# Configuration centrale du pipeline TestMaker.
languages: [python, javascript, go, rust, java]

paths:
  sources: data/sources.jsonl              # code source à tester (étape 1)
  teacher_gen: data/teacher_gen.jsonl      # sorties brutes du teacher (étape 2)
  teacher_val: data/teacher_val.jsonl      # sorties exécutées dans la sandbox (étape 3)
  sft_dir: data/sft                        # train.jsonl / val.jsonl (étape 4)
  sandbox_tmp: .sandbox_tmp                # doit être partagé avec Docker Desktop (OK sous /Users)

# Modèle professeur : n'importe quel endpoint compatible OpenAI. `provider` choisit le profil ;
# surcharge possible en ligne de commande avec `--provider`.
# - ollama : local, gratuit, lent sur CPU (~1-2 min par test) -> pour valider la chaîne.
# - openrouter : Qwen2.5-Coder-32B, rapide et meilleur -> pour le volume.
# L'identifiant du modèle dépend du fournisseur ("Qwen/Qwen2.5-Coder-32B-Instruct" sur vLLM).
teacher:
  provider: ollama
  providers:
    ollama:
      model: qwen2.5-coder:7b
      base_url: http://localhost:11434/v1
      api_key_env: OLLAMA_API_KEY      # inutilisé par Ollama, n'importe quelle valeur
      concurrency: 1                   # un seul modèle sur le CPU : paralléliser ne sert à rien
      timeout_s: 1800                  # une réponse de 2048 tokens peut dépasser 5 min sur CPU
    openrouter:
      model: qwen/qwen-2.5-coder-32b-instruct
      base_url: https://openrouter.ai/api/v1
      api_key_env: TEACHER_API_KEY
      concurrency: 16
  n_candidates: 2          # rejection sampling : on garde le meilleur candidat validé
  temperature: 0.7
  max_tokens: 2048

student:
  base_model: Qwen/Qwen2.5-Coder-1.5B-Instruct
  output_dir: checkpoints/testmaker-1.5b

collect:
  hf_dataset: bigcode/the-stack-smol       # dataset "gated" : accepter les conditions + `hf auth login`
  max_per_language: 4000
  min_lines: 15
  max_lines: 250

sandbox:
  timeout_s: 60            # par variante (original ou mutant)
  n_mutants: 3
  memory: 1g
  cpus: 1
  workers: 4               # conteneurs en parallèle

filter:
  min_mutation_score: 0.34 # au moins 1 mutant sur 3 doit être détecté par les tests

sft:
  epochs: 2
  lr: 2.0e-4
  batch_size: 4
  grad_accum: 4
  max_length: 4096
  lora_r: 64
  lora_alpha: 128
  full_finetune: false

# Distillation on-policy optionnelle (étape 6). Le teacher doit partager le tokenizer
# du student (famille Qwen2.5-Coder) car la perte compare les distributions de logits.
gkd:
  teacher_model: Qwen/Qwen2.5-Coder-14B-Instruct
  lmbda: 0.5               # part des séquences générées par le student lui-même
  beta: 0.5                # 0 = KL avant, 1 = KL inverse, entre les deux = JSD généralisée
  temperature: 0.9
  max_new_tokens: 1024
  epochs: 1
  lr: 5.0e-6
  batch_size: 2
  grad_accum: 8
